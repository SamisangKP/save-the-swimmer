<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Save the Swimmer</title><style>body{font-family:Arial,sans-serif;background:linear-gradient(#e0f2fe,#fff,#cffafe);margin:0;color:#0c2747}.wrap{max-width:760px;margin:auto;padding:28px}.card{background:#fff;border-radius:24px;padding:24px;box-shadow:0 12px 30px #0c4a6e22}.hero{text-align:center}.scene{height:190px;border-radius:22px;background:linear-gradient(#bae6fd,#2563eb);display:flex;align-items:center;justify-content:center;font-size:64px;margin:18px 0;overflow:hidden}.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.pill{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:9px 14px;font-weight:700}.bar{height:10px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin:16px 0}.fill{height:100%;background:linear-gradient(90deg,#fb923c,#10b981)}button{font:inherit}.start,.next{border:0;background:#f97316;color:white;font-weight:800;padding:12px 22px;border-radius:14px;cursor:pointer}.opt{width:100%;padding:15px;border-radius:15px;border:2px solid #e2e8f0;background:#fff;text-align:left;font-weight:700;cursor:pointer}.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}.good{border-color:#10b981;background:#ecfdf5}.bad{border-color:#f43f5e;background:#fff1f2}.muted{opacity:.5}.feedback{margin-top:18px;padding:16px;border-radius:16px;background:#fef3c7}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.small{font-size:12px;color:#64748b}@media(max-width:600px){.opts{grid-template-columns:1fr}.wrap{padding:14px}}</style></head><body><div class='wrap' id='app'></div><script>
const missions=[
["🏊‍♂️🌊","Swimmer in Trouble!","Who is trained to help swimmers in trouble?",["🎣 A fisherman","🛟 A lifeguard","🏪 A shopkeeper","🧒 A classmate"],1,"A lifeguard is trained to watch swimmers and respond to water emergencies."],
["🚩🏊","Choose a Safe Place","Where should you swim?",["✅ Inside permitted areas","🌫️ In an unknown lake","🌊 Anywhere in a river","⛔ Outside permitted areas"],0,"Swim only in permitted areas and follow warning signs and local safety rules."],
["⚠️🌊","Spot the Danger","How can water accidents be prevented?",["🎲 Take risks","👀 Recognize dangers and follow safety rules","🏊 Swim alone","🙈 Ignore signs"],1,"Recognizing dangers early and following safety rules can prevent accidents."],
["🐊🌴","River Danger","What dangerous creatures may be in a river?",["🐊 Crocodiles","🐔 Chickens","🐱 Cats","🦋 Butterflies"],0,"Some rivers may contain dangerous wildlife such as crocodiles. Check local warnings."],
["🚣‍♀️💦","Stay Safe in the Boat","What should you keep inside a small boat?",["❌ Nothing","🙌 Your hands and feet","👟 Only your shoes","🎒 Only your bag"],1,"Keep your hands and feet inside to reduce the risk of injury or falling overboard."],
["🏊‍♀️❓","No Lifeguard Nearby","Why is swimming without a lifeguard dangerous?",["📏 The pool gets deeper","🆘 No properly trained person may be there to help","🥽 Goggles are not allowed","❄️ The water gets colder"],1,"If something goes wrong, a properly trained rescuer may not be available."],
["🧭💙","Safety Starts With You","Who is responsible for your safety?",["👩‍🏫 Only your teacher","👫 Only your friends","🙋 You","🤷 Nobody"],2,"You are responsible for making safe choices and following safety guidance."],
["🏆🛟","Final Rescue Rule","How should you follow water safety rules?",["✅ Strictly","🙋 Only when alone","📅 Only on weekends","🔀 Only sometimes"],0,"Follow water safety rules strictly and consistently."]];
let state={started:false,i:0,score:0,lives:3,selected:null,done:false}; const app=document.getElementById('app');
function reset(){state={started:true,i:0,score:0,lives:3,selected:null,done:false};render()}
function choose(x){if(state.selected!==null)return;state.selected=x;if(x===missions[state.i][4])state.score+=100;else state.lives=Math.max(0,state.lives-1);render()}
function next(){if(state.i===7)state.done=true;else{state.i++;state.selected=null}render()}
function render(){if(!state.started){app.innerHTML=`<div class='card hero'><div style='font-size:80px'>🏊‍♂️</div><h1>Save the Swimmer</h1><p>A swimmer needs your help! Complete 8 water-safety rescue missions.</p><div class='stats'><span class='pill'>❤️ 3 lives</span><span class='pill'>⭐ 800 points</span><span class='pill'>🛟 8 missions</span></div><p><button class='start' onclick='reset()'>▶ Start Rescue</button></p></div>`;return}if(state.done){app.innerHTML=`<div class='card hero'><div style='font-size:80px'>🏆</div><h1>Rescue Complete!</h1><h2>${state.score}/800 points</h2><p>❤️ ${state.lives} lives left</p><button class='start' onclick='reset()'>↻ Play Again</button></div>`;return}let m=missions[state.i],correct=state.selected===m[4];app.innerHTML=`<div class='top'><div><div class='small'>RESCUE MISSION ${state.i+1}/8</div><h1 style='margin:4px 0'>Save the Swimmer</h1></div><div class='stats'><span class='pill'>❤️ ${state.lives}</span><span class='pill'>⭐ ${state.score}</span></div></div><div class='scene'>${m[0]}</div><div class='small'>Rescue progress: ${state.i}/8</div><div class='bar'><div class='fill' style='width:${state.i/8*100}%'></div></div><div class='card'><h2>${m[1]}</h2><h3>${m[2]}</h3><div class='opts'>${m[3].map((o,x)=>{let c='';if(state.selected!==null)c=x===m[4]?'good':x===state.selected?'bad':'muted';return `<button class='opt ${c}' onclick='choose(${x})'>${o}</button>`}).join('')}</div>${state.selected!==null?`<div class='feedback'><b>${correct?'🛟 RESCUED! +100':'⚠️ Not the safest choice'}</b><p>${m[5]}</p><button class='next' onclick='next()'>${state.i===7?'Complete Rescue':'Next Mission →'}</button></div>`:''}</div>`}render();
</script></body></html>
